<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Memories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-love fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">♥ For <span data-her>You</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="memories.html">Our Memories</a></li>
        <li class="nav-item"><a class="nav-link" href="surprise.html">Surprise</a></li>
      </ul>
    </div>
  </div>
</nav>

<header class="page-header">
  <div class="container">
    <h1>Our Memories 📸</h1>
    <p class="fs-5 mb-0">Every picture holds a little piece of my heart</p>
  </div>
</header>

<main>
  <!-- Carousel -->
  <section>
    <div class="container">
      <div class="section-title reveal">
        <h2>KUCH HASEEN YADEN</h2>
        <div class="divider"></div>
      </div>
      <div class="carousel-wrap reveal">
        <div id="photoCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000"></div>
      </div>
    </div>
  </section>

  <!-- Photo cards -->
  <section style="background:var(--blush)">
    <div class="container">
      <div class="section-title reveal">
        <h2>Favourite Moments</h2>
        <p>Tap a photo to see it bigger</p>
        <div class="divider"></div>
      </div>
      <div class="row g-4" id="photoGrid"></div>
    </div>
  </section>

  <!-- Timeline -->
  <section>
    <div class="container">
      <div class="section-title reveal">
        <h2>Our Story</h2>
        <div class="divider"></div>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
</main>

<!-- Lightbox -->
<div class="modal fade" id="lightbox" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0" style="border-radius:22px;overflow:hidden">
      <button type="button" class="btn-close position-absolute top-0 end-0 m-3 bg-white p-2 rounded-circle" style="z-index:5" data-bs-dismiss="modal"></button>
      <img id="lightboxImg" class="w-100" alt="">
      <div class="p-3 text-center"><p id="lightboxCap" class="mb-0 display-font fs-5"></p></div>
    </div>
  </div>
</div>

<footer>
  <p class="mb-0">Made with ♥ by <span data-you>Your Name</span> · <span id="year"></span></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
